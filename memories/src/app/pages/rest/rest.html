<div class="descanso">
  <a routerLink="/" class="descanso-logo" aria-label="mémoires, inicio"><app-logo /></a>

  <!-- Constelación dormida: los hilos dibujan una luna y las estrellas respiran despacio -->
  <svg class="escena" viewBox="0 0 400 320" role="img" aria-label="Una luna hecha de estrellas unidas por hilos, en calma">
    <g class="hilos">
      <path pathLength="1" d="M236 58 C 170 64, 130 118, 136 170 S 196 268, 262 258" />
      <path pathLength="1" d="M236 58 C 196 84, 182 128, 190 168 S 226 238, 262 258" />
    </g>
    @for (s of estrellasLuna; track $index) {
      <circle class="estrella" [attr.cx]="s.x" [attr.cy]="s.y" [attr.r]="s.r" [style.animation-delay]="s.d + 's'" />
    }
    @for (s of polvo; track $index) {
      <circle class="polvo" [attr.cx]="s.x" [attr.cy]="s.y" r="1.4" [style.animation-delay]="s.d + 's'" />
    }
    <g class="zzz" aria-hidden="true">
      <text x="292" y="96">z</text>
      <text x="306" y="76">z</text>
      <text x="322" y="54">z</text>
    </g>
  </svg>

  <div class="descanso-texto">
    <p class="eyebrow">Pausa de bienestar</p>
    <h1 class="font-display text-[clamp(2.5rem,8vw,4rem)] leading-[1.02]">Buen momento para una pausa</h1>
    <p class="mt-3 text-ink-2">Cerramos tu sesión para que descanses. Tus conexiones y mensajes seguirán aquí cuando vuelvas.</p>
    <a routerLink="/entrar" class="btn btn-ghost mt-8">Volver más tarde</a>
  </div>
</div>
