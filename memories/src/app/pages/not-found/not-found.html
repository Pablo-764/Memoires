<div class="perdido">
  <a routerLink="/" class="perdido-logo" aria-label="mémoires, inicio"><app-logo /></a>

  <!-- Un hilo que se cortó: tú al centro y una estrella que se fue lejos -->
  <svg class="escena" viewBox="0 0 400 300" role="img" aria-label="Un hilo cortado entre tú y una estrella que se alejó">
    @for (s of vecinos; track $index) {
      <line class="hilo-ok" x1="160" y1="170" [attr.x2]="s.x" [attr.y2]="s.y" />
      <circle class="vecino" [attr.cx]="s.x" [attr.cy]="s.y" r="5" />
    }
    <path class="hilo-roto" pathLength="1" d="M160 170 C 200 150, 220 168, 246 150" />
    <path class="hilo-roto fin" pathLength="1" d="M276 132 C 300 118, 318 104, 340 84" />
    <g class="chispa" aria-hidden="true">
      <line x1="256" y1="146" x2="266" y2="136" />
      <line x1="252" y1="134" x2="270" y2="148" />
    </g>
    <circle class="lejana" cx="340" cy="84" r="7" />
    <circle class="tu" cx="160" cy="170" r="18" />
    <text class="tu-t" x="160" y="175" text-anchor="middle">tú</text>
  </svg>

  <div class="perdido-texto">
    <p class="cifra font-display" aria-hidden="true">404</p>
    <p class="sr-only">Error 404</p>
    <h1 class="text-3xl font-extrabold">Esta página no existe</h1>
    <p class="mt-3 text-ink-2">Este hilo no lleva a ningún lado: quizá el enlace cambió o se escribió mal. Vuelve a la portada y retoma desde ahí.</p>
    <a routerLink="/" class="btn btn-primary mt-8">Ir a la portada</a>
  </div>
</div>
