<app-auth-frame title="Qué gusto verte" subtitle="Inicia sesión para ver tus conexiones y planes.">
  <form class="flex flex-col gap-4" (ngSubmit)="submit()">
    <div>
      <label class="label" for="email">Correo electrónico</label>
      <input id="email" name="email" class="field" type="email" autocomplete="email" spellcheck="false" [(ngModel)]="email" [attr.aria-invalid]="error().includes('correo')" />
    </div>
    <div>
      <label class="label" for="password">Contraseña</label>
      <input id="password" name="password" class="field" type="password" autocomplete="current-password" [(ngModel)]="password" [attr.aria-invalid]="error().includes('contraseña')" />
    </div>
    @if (error()) {
      <p class="error-in text-sm font-medium text-danger" role="alert">{{ error() }}</p>
    }
    <button class="btn btn-primary mt-2 min-h-12">Iniciar sesión</button>
    <p class="text-center text-sm text-ink-mute">
      ¿No tienes cuenta? <a routerLink="/registro" class="font-semibold text-ink underline underline-offset-4">Crear cuenta</a>
    </p>
    <p class="sticky-note mt-3 text-sm">
      Demostración: usa cualquier correo y una contraseña de 8 caracteres. Para ver el panel de moderación, entra a
      <a routerLink="/admin" class="font-semibold underline underline-offset-4">/admin</a>.
    </p>
  </form>
</app-auth-frame>
