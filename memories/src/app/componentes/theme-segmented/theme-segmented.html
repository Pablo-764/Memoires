<div
  role="radiogroup"
  aria-label="Tema"
  class="relative grid rounded-full bg-paper-2 p-1 text-sm font-semibold shadow-[inset_0_0_0_1px_var(--color-line)]"
  [style.grid-template-columns]="'repeat(' + options().length + ', 1fr)'"
>
  <span
    aria-hidden="true"
    class="absolute inset-y-1 left-1 rounded-full bg-paper shadow-(--shadow-lift) transition-transform duration-300 ease-(--ease-out)"
    [style.width]="'calc((100% - 0.5rem) / ' + options().length + ')'"
    [style.transform]="'translateX(' + index() * 100 + '%)'"
  ></span>
  @for (o of options(); track o.value) {
    <button
      type="button"
      role="radio"
      [attr.aria-checked]="current() === o.value"
      class="relative z-10 min-h-9 rounded-full px-2 transition-colors duration-200"
      [class]="current() === o.value ? 'text-ink' : 'text-ink-3 hover:text-ink'"
      (click)="theme.set(o.value, { x: $event.clientX, y: $event.clientY })"
    >
      {{ o.label }}
    </button>
  }
</div>
