<span class="avatar-core" [style.background]="photo() ? null : background()">
  @if (photo()) {
    <img [src]="photo()" alt="" class="size-full object-cover" draggable="false" />
  } @else {
    {{ initial() }}
  }
</span>
@if (ring() !== 'none') {
  @if (ring() === 'glow') {
    <span class="af-glow" [style.background]="frameInfo().bg" [style.--t.px]="thickness()"></span>
  }
  <span class="avatar-frame" [class.af-dash]="ring() === 'dash'" [style.background]="frameInfo().bg" [style.--t.px]="thickness()"></span>
  @if (ring() === 'double') {
    <span class="af-double" [style.border-color]="accent()" [style.--t.px]="thickness()"></span>
  }
  @if (ring() === 'orbit') {
    <span class="af-orbit" [style.--t.px]="thickness()" [style.color]="accent()"><span class="af-moon"></span></span>
  }
}
