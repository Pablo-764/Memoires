<aside class="sticky top-0 hidden h-dvh p-3 md:block">
  <div class="notebook flex h-full flex-col px-4 pb-5 pt-6">
    <a routerLink="/app/descubre" class="relative z-10 pl-5" aria-label="Inicio de mémoires">
      <app-logo />
    </a>

    <nav class="relative z-10 mt-9 flex flex-col gap-1.5 pl-5" aria-label="Principal">
      @for (n of items(); track n.to; let i = $index) {
        <a [routerLink]="n.to" [attr.aria-current]="active() === i ? 'page' : null" class="nb-link" [class.is-on]="active() === i">
          <app-icon [name]="n.icon" [size]="19" />
          <span class="nb-label">{{ n.label }}</span>
          @if (active() === i) {
            <svg class="nb-arrow" viewBox="0 0 40 16" aria-hidden="true">
              <path d="M38 8C28 4 16 11 4 8m0 0 6-5M4 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          }
        </a>
      }
    </nav>

    <div class="relative z-10 mt-auto flex flex-col gap-5 pl-5">
      <a routerLink="/app/suscripcion" class="sticky-note">
        <span class="note-tape" aria-hidden="true"></span>
        <span class="hand block text-lg leading-none">tu plan:</span>
        <span class="font-display text-2xl" [class.italic]="store.tier() === 'lucidite'">{{ tierInfo().name }}</span>
        <span class="mt-1 block text-sm">
          @if (left() === null) { Matches ilimitados } @else { <span class="mono-tag">{{ left() }} matches/semana</span> }
        </span>
        @if (left() !== null) {
          <span class="note-meter">
            <span class="bar-grow block h-full origin-left" [style.transform]="'scaleX(' + left()! / limit() + ')'"></span>
          </span>
        }
      </a>

      <app-theme-segmented [options]="themes" />

      <div class="flex items-center gap-3 border-t-[1.5px] border-dashed border-line-strong pt-4">
        <app-avatar [name]="displayName()" [hue]="260" [size]="36" [frame]="store.me().frame" [photo]="store.me().photo" />
        <span class="min-w-0 flex-1 truncate text-sm font-semibold">{{ displayName() }}</span>
        <a routerLink="/app/ajustes" aria-label="Ajustes" class="btn size-9 min-h-0 p-0 text-ink-soft hover:text-ink">
          <app-icon name="settings" [size]="18" />
        </a>
      </div>
    </div>
  </div>
</aside>
