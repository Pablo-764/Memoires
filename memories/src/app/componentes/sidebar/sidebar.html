<aside class="rail sticky top-0 hidden h-dvh flex-col border-r border-line bg-paper/80 px-5 pb-5 pt-7 backdrop-blur-sm md:flex">
  <a routerLink="/app/descubre" class="self-start" aria-label="Inicio de mémoires">
    <app-logo />
  </a>

  <nav class="mt-10 flex flex-col gap-1" aria-label="Principal">
    @for (n of items(); track n.to; let i = $index) {
      <a [routerLink]="n.to" [attr.aria-current]="active() === i ? 'page' : null" class="rail-link" [class.is-on]="active() === i">
        <span class="rail-dot" aria-hidden="true"></span>
        <app-icon [name]="n.icon" [size]="19" />
        <span>{{ n.label }}</span>
      </a>
    }
  </nav>

  <div class="mt-auto flex flex-col gap-4">
    <a routerLink="/app/suscripcion" class="rail-plan" [class.is-lucidite]="store.tier() === 'lucidite'">
      <span class="text-xs font-semibold text-ink-2">Tu plan</span>
      <span class="block text-lg font-bold leading-tight">{{ tierInfo().name }}</span>
      <span class="mt-0.5 block text-sm text-ink-2">
        @if (left() === null) {
          Matches ilimitados
        } @else {
          <span class="tabular-nums">{{ left() }}</span> de {{ limit() }} matches esta semana
        }
      </span>
      @if (left() !== null) {
        <span class="note-meter">
          <span class="bar-grow block h-full origin-left" [style.transform]="'scaleX(' + left()! / limit() + ')'"></span>
        </span>
      }
    </a>

    <app-theme-segmented [options]="themes" />

    <div class="flex items-center gap-3 border-t border-line pt-4">
      <app-avatar [name]="displayName()" [hue]="260" [size]="36" [frame]="store.me().frame" [photo]="store.me().photo" />
      <span class="min-w-0 flex-1 truncate text-sm font-semibold">{{ displayName() }}</span>
      <a routerLink="/app/ajustes" aria-label="Ajustes" class="btn btn-icon text-ink-2">
        <app-icon name="settings" [size]="18" />
      </a>
    </div>
  </div>
</aside>
