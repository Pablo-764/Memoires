<aside class="sticky top-0 hidden h-dvh p-3 md:block">
  <div class="night-glow flex h-full flex-col rounded-[30px] px-4 py-6">
    <a routerLink="/app/descubre" class="px-2" aria-label="Inicio de mémoires">
      <app-logo [bright]="true" />
    </a>

    <nav class="relative mt-10 flex flex-col gap-1" aria-label="Principal">
      <span
        aria-hidden="true"
        class="nav-pill absolute inset-x-0 top-0 rounded-2xl bg-white/12 shadow-[inset_0_0_0_1px_rgb(255_255_255/0.08)]"
        style="height: calc((100% - 0.75rem) / 4)"
        [style.opacity]="active() < 0 ? 0 : 1"
        [style.transform]="'translateY(calc(' + (active() < 0 ? 0 : active()) + ' * (100% + 0.25rem)))'"
      ></span>
      @for (n of items(); track n.to; let i = $index) {
        <a
          [routerLink]="n.to"
          [attr.aria-current]="active() === i ? 'page' : null"
          class="relative flex items-center gap-3 rounded-2xl px-3.5 py-3 text-[0.95rem] font-medium transition-colors duration-200"
          [class]="active() === i ? 'text-white' : 'text-white/60 hover:text-white/90'"
        >
          <app-icon [name]="n.icon" [size]="19" />
          <span>{{ n.label }}</span>
        </a>
      }
    </nav>

    <div class="mt-auto flex flex-col gap-4">
      <a routerLink="/app/suscripcion" class="rounded-[22px] bg-white/6 p-4 transition-colors duration-200 hover:bg-white/10">
        <span class="block text-xs font-medium text-white/50">Tu plan</span>
        <span class="font-display text-2xl" [class.italic]="store.tier() === 'lucidite'">{{ tierInfo().name }}</span>
        <span class="mt-1 block text-sm text-white/60">
          {{ left() === null ? 'Matches ilimitados' : 'Te quedan ' + left() + ' matches esta semana' }}
        </span>
        @if (left() !== null) {
          <span class="mt-3 block h-1.5 overflow-hidden rounded-full bg-white/10">
            <span class="bar-grow block h-full origin-left rounded-full bg-white/80" [style.transform]="'scaleX(' + left()! / limit() + ')'"></span>
          </span>
        }
      </a>

      <app-theme-segmented [onNight]="true" [options]="themes" />

      <div class="flex items-center gap-3 border-t border-white/10 px-1 pt-4">
        <app-avatar [name]="displayName()" [hue]="260" [size]="36" [frame]="store.me().frame" [photo]="store.me().photo" />
        <span class="min-w-0 flex-1 truncate text-sm font-medium">{{ displayName() }}</span>
        <a routerLink="/app/ajustes" aria-label="Ajustes" class="btn size-9 min-h-0 p-0 text-white/70 hover:text-white">
          <app-icon name="settings" [size]="18" />
        </a>
      </div>
    </div>
  </div>
</aside>
