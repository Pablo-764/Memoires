<div class="pointer-events-none fixed inset-x-0 bottom-24 z-[60] flex flex-col items-center gap-2 px-4 md:bottom-6" aria-live="polite">
  @for (t of store.toasts(); track t.id) {
    <button
      animate.leave="toast-out"
      class="toast-note rise-in pointer-events-auto flex items-center gap-2.5 bg-ink px-5 py-3 text-sm font-semibold text-paper"
      (click)="store.dismissToast(t.id)"
    >
      <span class="size-2 shrink-0 rounded-full" [class]="t.tone === 'danger' ? 'bg-danger' : t.tone === 'ok' ? 'bg-hobby-tint' : 'bg-tint'" aria-hidden="true"></span>
      {{ t.text }}
    </button>
  }
</div>
