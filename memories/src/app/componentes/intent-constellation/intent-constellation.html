<svg viewBox="0 0 400 400" class="h-full w-full overflow-visible" aria-hidden="true">
  <!-- anillo guía -->
  <circle [attr.cx]="c" [attr.cy]="c" r="112" class="guide" />
  @for (n of nodes; track n.intent; let i = $index) {
    <g class="cluster" [attr.data-intent]="n.intent" [class.is-on]="active() === n.intent" [class.is-off]="active() && active() !== n.intent" [style.--i]="i">
      <line [attr.x1]="c" [attr.y1]="c" [attr.x2]="n.x" [attr.y2]="n.y" class="thread thread-main" pathLength="1" />
      @for (p of n.people; track $index; let k = $index) {
        <line [attr.x1]="n.x" [attr.y1]="n.y" [attr.x2]="p.x" [attr.y2]="p.y" class="thread" pathLength="1" [style.--k]="k" />
        <circle [attr.cx]="p.x" [attr.cy]="p.y" r="4.5" class="person" [style.--k]="k" />
      }
      <circle [attr.cx]="n.x" [attr.cy]="n.y" r="13" class="node" />
      <text [attr.x]="n.x + (n.x < c ? -22 : 22)" [attr.y]="n.y + 5" class="node-label" [attr.text-anchor]="n.x < c ? 'end' : 'start'">{{ intents[n.intent].short }}</text>
    </g>
  }
  <circle [attr.cx]="c" [attr.cy]="c" r="22" class="me" />
  <text [attr.x]="c" [attr.y]="c + 5" class="me-label">Tú</text>
</svg>
