@if (inflado(); as f) {
  <app-inflado class="fx-inflado" [intent]="f.shape" [phrases]="[name()]" [colors]="f.colors" [mode]="preview() ? 'still' : 'spin'" [res]="150" [decorative]="true" />
}
@for (p of particles(); track $index) {
  <span
    class="fx"
    [class]="'fx-' + info().dir"
    [style.left.%]="p.left"
    [style.top.%]="p.top"
    [style.color]="p.color"
    [style.animation-delay.s]="p.delay"
    [style.animation-duration.s]="p.duration"
    [style.--a]="p.angle + 'deg'"
    [style.--r]="p.radius + 'cqmin'"
  >
    <span class="fx-in" [style.animation-duration.s]="p.sway" [style.animation-delay.s]="p.delay">
      @if (textAlbum.on()) {
        <span class="fx-glyph" [style.font-size.px]="p.size * 0.9">{{ textGlyphs[$index % textGlyphs.length] }}</span>
      } @else if (info().icon; as icon) {
        <app-icon [name]="icon" [size]="p.size" [filled]="true" />
      } @else {
        @if (info().shape === 'glyph') {
          <span class="fx-glyph" [style.font-size.px]="p.size * 0.9">{{ glyphs[$index % glyphs.length] }}</span>
        } @else {
          <span class="fx-shape" [class]="'fx-' + info().shape" [style.--z.px]="p.size"></span>
        }
      }
    </span>
  </span>
}
