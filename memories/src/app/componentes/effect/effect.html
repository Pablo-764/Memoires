@for (p of particles(); track $index) {
  <span
    class="fx"
    [class]="'fx-' + info().dir"
    [style.left.%]="p.left"
    [style.top.%]="p.top"
    [style.color]="p.color"
    [style.animation-delay.s]="p.delay"
    [style.animation-duration.s]="p.duration"
    [style.--a]="p.angle + 'deg'"
    [style.--r]="p.radius + 'cqmin'"
  >
    <span class="fx-in" [style.animation-duration.s]="p.sway" [style.animation-delay.s]="p.delay">
      @if (info().icon; as icon) {
        <app-icon [name]="icon" [size]="p.size" [filled]="true" />
      } @else {
        <span class="fx-shape" [class]="'fx-' + info().shape" [style.--z.px]="p.size"></span>
      }
    </span>
  </span>
}
