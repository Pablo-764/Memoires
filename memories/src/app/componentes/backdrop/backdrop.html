<ng-template #wall let-fill="fill">
  <div class="kt-wall" [class.kt-fill]="fill" [class.kt-outline]="!fill">
    @for (r of rows; track $index) {
      <div class="kt-row" [style.--dir]="r.dir" [style.--tone]="r.tone">
        <div class="kt-track" [style.animation-duration]="r.speed + 's'" [class.kt-reverse]="r.dir > 0">
          @for (copy of [0, 1]; track copy) {
            <span class="kt-run">
              @for (w of r.words; track $index) {
                <span class="kt-word" [class.kt-serif]="w.serif">{{ w.text }}</span>
                <span class="kt-sep"></span>
              }
            </span>
          }
        </div>
      </div>
    }
  </div>
</ng-template>

<ng-container *ngTemplateOutlet="wall; context: { fill: false }" />
<div class="kt-lens-mask">
  <ng-container *ngTemplateOutlet="wall; context: { fill: true }" />
</div>
<div class="kt-lens"></div>
