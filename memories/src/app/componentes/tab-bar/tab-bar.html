<nav
  class="vt-dock tabbar fixed inset-x-0 bottom-0 z-30 grid grid-cols-4 border-t border-line bg-paper/92 px-2 pb-[max(0.5rem,env(safe-area-inset-bottom))] pt-1.5 backdrop-blur-md md:hidden"
  aria-label="Principal"
>
  @for (n of items(); track n.to; let i = $index) {
    <a [routerLink]="n.to" [attr.aria-current]="active() === i ? 'page' : null" class="tab-link" [class.is-on]="active() === i">
      <span class="tab-icon"><app-icon [name]="n.icon" [size]="20" /></span>
      <span>{{ n.label }}</span>
    </a>
  }
</nav>
