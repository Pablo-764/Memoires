<nav class="vt-dock tabbar fixed inset-x-3 bottom-[max(0.75rem,env(safe-area-inset-bottom))] z-30 grid grid-cols-4 p-1.5 md:hidden" aria-label="Principal">
  @for (n of items(); track n.to; let i = $index) {
    <a
      [routerLink]="n.to"
      [attr.aria-current]="active() === i ? 'page' : null"
      class="tabbar-link relative flex flex-col items-center gap-0.5 py-2 text-[11px] font-semibold"
      [class.is-on]="active() === i"
    >
      <app-icon [name]="n.icon" [size]="20" />
      <span>{{ n.label }}</span>
    </a>
  }
</nav>
