<div class="bn fade-in" [attr.data-overlay]="overlay()" [style.background]="custom() ? null : info().css">
  @switch (overlay()) {
    @case ('photo') {
      <img [src]="custom()" alt="" class="bn-photo" draggable="false" />
    }
    @case ('stars') {
      <span class="bn-stars" [style.--c]="color(0)"></span>
      <span class="bn-stars bn-stars-b" [style.--c]="color(1)"></span>
    }
    @case ('blobs') {
      <span class="bn-blob bn-blob-a" [style.--c]="color(0)"></span>
      <span class="bn-blob bn-blob-b" [style.--c]="color(1)"></span>
    }
    @case ('asanoha') {
      <span class="bn-asanoha" [style.--c]="color(0)"></span>
    }
    @case ('lines') {
      <span class="bn-lines" [style.--c]="color(0)"></span>
    }
    @case ('threads') {
      <svg class="bn-threads" viewBox="0 0 100 100" preserveAspectRatio="none" [style.--c]="color(0)">
        @for (l of links; track $index) {
          <line [attr.x1]="l.a[0]" [attr.y1]="l.a[1]" [attr.x2]="l.b[0]" [attr.y2]="l.b[1]" />
        }
      </svg>
      @for (p of stars; track $index) {
        <span class="bn-node" [style.left.%]="p[0]" [style.top.%]="p[1]" [style.--c]="color($index)" [style.--i]="$index"></span>
      }
    }
  }
</div>
