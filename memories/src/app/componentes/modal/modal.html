<div class="fixed inset-0 z-50 flex items-end sm:items-stretch sm:justify-end">
  <div class="fade-in absolute inset-0 bg-ink/40" tabindex="-1" aria-hidden="true" (click)="closed.emit()" (keydown.escape)="closed.emit()"></div>
  <div
    #panel
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title()"
    class="modal-panel sheet relative flex max-h-[92dvh] w-full flex-col overflow-hidden rounded-t-(--radius-sheet) bg-paper sm:m-3 sm:max-h-none sm:rounded-(--radius-sheet)"
    [class]="wide() ? 'sm:w-[38rem]' : 'sm:w-[28rem]'"
    [style.translate]="drag() ? '0 ' + drag() + 'px' : null"
  >
    <!-- Asa: en celular se arrastra hacia abajo para cerrar -->
    <div class="sheet-grip sm:hidden" (pointerdown)="grab($event)" (pointermove)="move($event)" (pointerup)="release()" (pointercancel)="release()" aria-hidden="true">
      <span></span>
    </div>
    <div class="flex items-start justify-between gap-4 px-6 pt-2 sm:px-8 sm:pt-8">
      <h2 class="text-2xl">{{ title() }}</h2>
      <button type="button" data-close class="btn btn-icon -mr-2 -mt-1 text-ink-2" aria-label="Cerrar" (click)="closed.emit()">
        <app-icon name="x" [size]="20" />
      </button>
    </div>
    <div class="overflow-y-auto overscroll-contain px-6 pb-[max(1.5rem,env(safe-area-inset-bottom))] pt-4 sm:px-8 sm:pb-8">
      <ng-content />
    </div>
  </div>
</div>
