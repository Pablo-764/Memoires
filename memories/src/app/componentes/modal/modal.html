<div class="fixed inset-0 z-50 grid place-items-end sm:place-items-center">
  <div class="fade-in absolute inset-0 bg-[#110a1d]/55" tabindex="-1" aria-hidden="true" (click)="closed.emit()" (keydown.escape)="closed.emit()"></div>
  <div
    #panel
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title()"
    class="modal-panel sheet relative max-h-[92dvh] w-full overflow-y-auto overscroll-contain rounded-t-[16px] bg-surface p-6 sm:rounded-[14px]"
    [class]="wide() ? 'sm:max-w-2xl' : 'sm:max-w-md'"
  >
    <div class="mb-4 flex items-start justify-between gap-4">
      <h2 class="text-[1.85rem]">{{ title() }}</h2>
      <button type="button" data-close class="btn -mr-2 -mt-1 size-10 min-h-0 p-0 text-ink-mute" aria-label="Cerrar" (click)="closed.emit()">
        <app-icon name="x" [size]="20" />
      </button>
    </div>
    <ng-content />
  </div>
</div>
