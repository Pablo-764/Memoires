<span class="logo-word" aria-hidden="true">
  @for (l of letters; track $index) {
    @if ($index === 1) {
      <span class="logo-l logo-e" [style.--i]="$index">{{ l }}<span class="logo-dot"></span></span>
    } @else {
      <span class="logo-l" [style.--i]="$index">{{ l }}</span>
    }
  }
</span>
<span class="sr-only">mémoires</span>
