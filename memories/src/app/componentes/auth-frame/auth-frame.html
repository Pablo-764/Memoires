<div class="grid min-h-dvh lg:grid-cols-[1fr_minmax(0,0.9fr)]">
  <div class="flex flex-col px-4 py-5 sm:px-10">
    <div class="flex items-center justify-between">
      <a routerLink="/" aria-label="Volver a la portada"><app-logo /></a>
      <button appThemeIcon class="text-ink-2"></button>
    </div>

    <div class="enter mx-auto my-auto w-full max-w-[26rem] py-10">
      <h1 class="font-display text-[clamp(2.75rem,8vw,3.75rem)]">{{ title() }}</h1>
      <p class="mt-3 text-lg text-ink-2">{{ subtitle() }}</p>
      <div class="mt-8"><ng-content /></div>
    </div>
  </div>

  <!-- Panel de la marca: la constelación y las promesas de seguridad -->
  <aside class="auth-panel hidden flex-col justify-center gap-12 border-l border-line p-10 lg:flex" aria-label="Por qué mémoires">
    <app-intent-constellation class="mx-auto w-full max-w-[380px]" />
    <ul class="flex flex-col gap-4">
      @for (p of promises; track p.text) {
        <li><app-seal [kind]="p.kind" size="md" [label]="p.text" /></li>
      }
    </ul>
  </aside>
</div>
