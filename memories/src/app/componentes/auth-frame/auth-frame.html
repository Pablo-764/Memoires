<div class="grid min-h-dvh lg:grid-cols-[1fr_1.1fr]">
  <div class="flex flex-col px-5 py-6 sm:px-10">
    <div class="flex items-center justify-between">
      <a routerLink="/" aria-label="Volver a la portada"><app-logo /></a>
      <button appThemeIcon aria-label="Cambiar tema"></button>
    </div>

    <!-- El formulario es una hoja de papel pegada con cinta -->
    <div class="auth-sheet enter mx-auto my-auto w-full max-w-[25rem]">
      <span class="auth-tape" aria-hidden="true"></span>
      <h1 class="text-[2.8rem] leading-none">{{ title() }}</h1>
      <p class="hand mt-2 text-[1.45rem] leading-tight text-ink-soft">{{ subtitle() }}</p>
      <div class="mt-7"><ng-content /></div>
    </div>
  </div>

  <!-- Collage de recuerdos: se mueve con el cursor -->
  <div class="auth-collage hidden lg:block" (pointermove)="tilt($event)" (pointerleave)="tilt(null)" aria-hidden="true">
    <div class="auth-board">
      @for (p of photos; track p.src; let i = $index) {
        <figure class="auth-polaroid" [style.--r]="p.r + 'deg'" [style.--depth]="p.depth" [style.left.%]="p.x" [style.top.%]="p.y" [style.--i]="i">
          <span class="auth-polaroid-tape"></span>
          <img [src]="p.src" alt="" width="400" height="400" decoding="async" />
          <figcaption class="hand">{{ p.note }}</figcaption>
        </figure>
      }
    </div>
    <p class="absolute bottom-5 right-7 text-xs text-ink-mute">Fotos de Unsplash</p>
  </div>
</div>
